name: 법인대표 데일리

on:
  # 스케줄은 외부 크론 서비스(cron-job.org 등)가 07:00 KST 정각에
  # workflow_dispatch API를 호출해서 대신 트리거한다.
  # GitHub 자체 schedule:은 정확한 시각을 보장하지 않아(2026-08-27 최대 5시간 지연 확인) 뺐다.
  workflow_dispatch:           # 수동 실행 버튼 + 외부 크론이 이걸 호출함

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r ceo-daily/requirements.txt

      - name: Run brief
        working-directory: ceo-daily
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CEO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CEO }}
        run: python main.py

      - name: Commit state & archive
        run: |
          git config user.name  "ceo-daily-bot"
          git config user.email "actions@github.com"
          git add ceo-daily/state ceo-daily/archive
          git diff --staged --quiet && exit 0
          git commit -m "brief $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash
          git push
