name: 법인대표 데일리

on:
  schedule:
    - cron: "0 22 * * 0-4"    # UTC 22:00 = KST 익일 07:00 (월~금 발송)
  workflow_dispatch:           # 수동 실행 버튼

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r ceo-daily/requirements.txt

      - name: Run brief
        working-directory: ceo-daily
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_CEO }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL_CEO }}
        run: python main.py

      - name: Commit state & archive
        run: |
          git config user.name  "ceo-daily-bot"
          git config user.email "actions@github.com"
          git add ceo-daily/state ceo-daily/archive
          git diff --staged --quiet || git commit -m "brief $(date -u +%Y-%m-%d)"
          git push
